
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Camp Registration</title>


          <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">

    <style>
        body {
            background-color: #eeeeee;
        }

        .camp-container {
            max-width: 550px;
            background-color: #91afe2;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .camp-header {
            background-color: #4d89f5;
            padding: 20px;
        }

        .camp-banner {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-control,
        .form-select {
            background-color: #e8e1dc;
            border: 1px solid #2525a8;
            font-size: 13px;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #ffffff;
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,.15);
        }

        input[type="range"] {
            accent-color: #0d6efd;
        }

        .form-control-color {
            width: 100%;
            height: 38px;
        }

        .progress {
            height: 6px;
            background-color: #eeeeee;
        }

        .mission-btn {
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="container my-3 camp-container p-0">

    
    <header class="camp-header text-center">

        <h2 class="fw-bold mb-1">
            🚀 SPACE CAMP
        </h2>

        <small>Reach Beyond the Stars · Train Like an Astronaut</small>

    </header>

    
    <img src="./images/astronot.jpg"
         class="camp-banner"
         alt="Astronaut in space">

   
    <div class="p-3 p-md-4">

        <h5 class="text-center fw-bold mb-3">
            Explorer Registration Form
        </h5>

        <form>

            <div class="row g-3">

                <div class="col-12 col-md-6">
                    <label class="form-label">Explorer Name</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Enter Explorer Name"
                           required>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password"
                           class="form-control"
                           placeholder="Create Password"
                           required>
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label">Age</label>
                    <input type="number"
                           class="form-control"
                           value="18"
                           min="1"
                           max="100">
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label">Fitness Score</label>
                    <input type="range"
                           class="form-range mt-2"
                           min="0"
                           max="100"
                           value="70">
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label">Camp Date</label>
                    <input type="date" class="form-control">
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label">Reporting Time</label>
                    <input type="time" class="form-control">
                </div>

                <div class="col-12">
                    <label class="form-label">Mission Briefing</label>
                    <input type="datetime-local" class="form-control">
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label">Preferred Suit Color</label>
                    <input type="color"
                           class="form-control form-control-color"
                           value="#ffffff">
                </div>

                <div class="col-12 col-md-6">
                    <label class="form-label">Upload ID Card</label>
                    <input type="file"
                           class="form-control"
                           accept="image/*,.pdf">
                </div>

                <div class="col-12">
                    <label class="form-label">
                        Why do you want to become an Astronaut?
                    </label>

                    <textarea class="form-control"
                              rows="3"
                              placeholder="Write your answer here..."></textarea>
                </div>

                <div class="col-12">

                    <label class="form-label">Medical Fitness</label>

                    <div class="progress mt-2">
                        <div class="progress-bar bg-warning"
                             style="width: 82%">
                        </div>
                    </div>

                </div>

                <div class="col-12">

                    <label class="form-label">Registration Progress</label>

                    <div class="progress mt-2">
                        <div class="progress-bar bg-primary"
                             style="width: 65%">
                        </div>
                    </div>

                </div>

            
                <div class="col-12 mt-4">

                    <button type="submit"
                            class="btn btn-primary w-100 mission-btn">
                        🚀 Register Mission
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

</body>
</html>
