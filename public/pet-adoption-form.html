<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <title>pet-adoption-form</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            display: flex;
            background-color: white;
            justify-content: center;
        }

        .left-container {
            background-color: #8B5E3C;
            width: 400px;
            text-align: center;
            height: auto;
        }

        .left-container-content img {
            width: 80%;
            margin-top: 30px;
            height: 400px;
            border-radius: 10px;
        }

        .left-container-content h1,
        p {
            color: white;

        }

        ul {
            display: flex;
            gap: 25px;
            color: white;
            justify-content: center;
        }

        .right {
            background-color: rgb(243, 243, 243);
            /* text-align: center; */
            width: 520px;
            height: auto;
        }

        .right h2 {
            color: rgb(6, 6, 6);
            text-align: center;
        }

        input {
            width: 90%;
            height: 30px;
            border-radius: 5px;
            border: none;
            border: 3px solod black;
            padding: 5px;
        }
        dt, dd {
            margin-left: 35px;
            font-weight: bold;
        }
        
        dd {
            justify-content: center;
            margin-top: 5px;
        }
        button{
            background-color: #8B5E3C;
            color: white;
            border: none;
            width: 90%;
            font-size: large;
            padding: 15px 20px;
            border-radius: 5px;
            margin-left: 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-container">
            <div class="left-container-content">
                <img src="./images/puppy-6.jpg" alt="puppy image">
                <h1>🐾 HAPPY PAWS</h1>
                <p>Find Your Forever Friend <i class="bi bi-heart"></i> </p>
                <div>
                    <ul>
                        <li style="list-style: none;">Love</li>
                        <li>Care</li>
                        <li>Adopt</li>
                    </ul>

                </div>
            </div>
        </div>
        <div class="right">
            <h2>Pet Adoption Registration</h2>
            <div class="form-container">
                <form>
                    <dl>
                        <dt>Adopter Name</dt>
                        <dd><input type="text" placeholder="Enter Your Name" name="name"></dd>
                    </dl>

                    <dl>
                        <dt>Create Password</dt>
                        <dd><input type="password" placeholder="Create Password" name="password"></dd>
                    </dl>

                    <dl>
                        <dt>Email Address</dt>
                        <dd><input type="email" placeholder="Email Address" name="email"></dd>
                    </dl>

                    <dl>
                        <dt>Instagram Profile</dt>
                        <dd><input type="text" placeholder="https://instagram.com/username" name="username"></dd>
                    </dl>

                    <dl>
                        <dt>Preferred Pet</dt>
                        <dd><input type="text" placeholder="Enter Your Name" name="name-list" list="Preferred Pet">
                       </dd>
                        <datalist id="Preferred Pet">
                            <option value="Golden Retriever"></option>
                            <option value="Labrador"></option>
                            <option value="Baegle"></option>
                            <option value="Persian Cat"></option>
                            <option value="Husky"></option>
                        </datalist>
                    </dl>

                    <dl>
                        <dt>Home Size (Sq.ft)</dt>
                        <dd><input type="text" placeholder="800" name="name"></dd>
                    </dl>
                    <dl>
                        <dt>Application ID</dt>
                        <dd><input type="text" placeholder="ADP2026" name="name"></dd>
                    </dl>

                    <dl>
                        <dt>Application Status</dt>
                        <dd><input type="text" placeholder="Application Status" name="name"></dd>
                    </dl>
                    <button>🐾 Adopt Now</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
