<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <title>Gym Membership Form</title>
    <style>
        .gym-container {
            max-width: 550px;
            background-color: #a9c2ed;
            height: 700px;
            border-radius: 12px;
            box-shadow: 8px 10px 15px rgb(8, 8, 8);
            overflow: hidden;

        }

        img {
            margin-top: 10px;
            height: 200px;
            width: 90%;
            border-radius: 10px;
            box-shadow: 5px 5px 15px black;
        }
/* 
        form {
            width: 90%;
        } */
        .gym-label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="container my-3 gym-container p-0">
        <header class="gym-header text-center">
            <h1 class="fw-bold">🏋️ Gym Membership Portal</h1>
            <img src="./images/Gym.jpg" alt="Gym">
        </header>

        <form class="mt-4">
            <div class="row g-3">
                <label for="gym-label">Name</label>
                <input type="text" class="form-control" placeholder="Enter Explorer Name" required>
            </div>
        </form>
    </div>
</body>

</html>
