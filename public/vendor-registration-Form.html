<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechStore - Vendor Registration Portal</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 36px 16px;
    min-height: 100vh;
    background: #e6efff;
    font-family: Arial, Helvetica, sans-serif;
  }

  .container {
    width: 100%;
    max-width: 450px;
    margin: 0 auto;
    background: #fff;
    padding: 24px 25px 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }

  h1 {
    margin: 0;
    text-align: center;
    color: #0a66cc;
    font-size: 32px;
    letter-spacing: 0.5px;
  }

  h2 {
    margin: 12px 0 20px;
    text-align: center;
    color: #777;
    font-size: 20px;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 16px;
    font-weight: bold;
    color: #000;
  }

  input {
    width: 100%;
    height: 39px;
    margin-bottom: 15px;
    padding: 0 10px;
    border: 1px solid #888;
    border-radius: 4px;
    font-size: 15px;
    color: #000;
  }

  input::placeholder { color: #757575; }

  input:focus {
    outline: none;
    border: 2px solid #000;
    border-radius: 6px;
  }

  input[readonly] {
    background: #f9f9f9;
    color: #555;
  }

  button {
    width: 100%;
    height: 42px;
    margin-top: 10px;
    background: #0a66cc;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover { background: #0856ab; }
</style>
</head>
<body>

  <div class="container">
    <h1>TECHSTORE</h1>
    <h2>Vendor Registration Portal</h2>

    <form>
      <label for="vendorName">Vendor Name</label>
      <input type="text" id="vendorName" placeholder="Enter Vendor Name" autofocus>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter Password">

      <label for="email">Business Email</label>
      <input type="email" id="email" placeholder="Enter Business Email">

      <label for="website">Company Website</label>
      <input type="url" id="website" placeholder="https://example.com">

      <label for="search">Search Products</label>
      <input type="search" id="search" placeholder="Search Products">

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" value="1" min="1">

      <label for="vendorId">Vendor ID</label>
      <input type="text" id="vendorId" value="TV1024">

      <label for="gst">GST Number</label>
      <input type="text" id="gst" value="29ABCDE1234F1Z5" readonly>

      <button type="submit">Register Vendor</button>
    </form>
  </div>

</body>
</html>
