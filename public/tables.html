
<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
    <style>
        tr{
            font-size: 35px;
        }
        table{
            margin-bottom: 60px;
        }
    </style>
</head>
<body>
    <h1>Sample Table</h1>
    <table border="3" width="200">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>23</td>
            <td>Hyderabad</td>
        </tr>
        <tr>
            <td>Amit</td>
            <td>24</td>
            <td>Bengluru</td>
        </tr>
        <tr>
            <td>Yuvraj</td>
            <td>28</td>
            <td>Bhopal</td>
        </tr>
    </table>
    
    <table border="3">
        <tr>
            <th>Product</th>
            <th>price</th>
            <th>Quantity</th>
        </tr>
        <tr>
            <td>laptop</td>
            <td>$999</td>
            <td>5</td>
        </tr>
        <tr>
            <td>smartphone</td>
            <td>$499</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>$299</td>
            <td>7</td>
        </tr>
        <tr>
            <td>Total Item</td>
            <td></td>
            <td>22</td>
        </tr>

    </table>
    <table border="2">
        <tr>
            <th>Emloyee</th>
            <th>Department</th>
            <th>Position</th>
        </tr>
        <tr>
            <td>John</td>
            <td>IT</td>
            <td>Manager</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>HR</td>
            <td>Executive</td>
        </tr>
        <tr>
            <td>Mike</td>
            <td>Finance</td>
            <td>Analyst</td>
        </tr>
        <tr>
            <td>Emily</td>
            <td>Marketing</td>
            <td>Coordinator</td>
        </tr>
    </table>
    <table style="border: 2px solid red;">
        <tr>
            <th >Email</th>
            <th>Tobias</th>
            <th>Linus</th>
        </tr>
    </table>
</body>
</html>
