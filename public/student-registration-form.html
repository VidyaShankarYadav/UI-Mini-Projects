<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
    <title>Document</title>
    <style>
        section {
            background-color: rgb(179, 184, 253);
        }

        .container {
            background-color: white;
            width: 450px;
            margin-top: 70px;
            border-radius: 10px;
            box-shadow: 2px 2px 12px black;
        }

        header {
            width: 100%;
            text-align: center;
            color: blue;
        }

        h1 {
            font-weight: bolder;
            color: rgb(56, 72, 248);
            font-size: 30px;
            padding: 30px;
        }

        label {
            font-weight: bold;
        }

        .form-control {
            border: 1px solid red;
            border-left: 5px solid red;
            border-radius: 8px;
            height: 50px;
            font-size: 18px;
            padding: 10px;
        }

        form {
            padding: 20px;
        }
    </style>
</head>

<body class="container-fluid" style="background-color: rgb(203, 215, 239);">

    <div class="container">
        <header>
            <h1>Student Registration Form</h1>
        </header>
        <form action="">
            <div class="mb-3">
                <label class="form-label">Student ID</label>
                <input type="text" class="form-control" placeholder="STD2026011" readonly>
            </div>

            <div class="mb-3">
                <label class="form-label" for="">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter Full Name">
            </div>
            <div class="mb-3">
                <label class="form-label" for="">Emal</label>
                <input class="form-control" type="email" placeholder="Enter Email">
            </div>
            <div class="mb-3">
                <label class="form-label" for="">Age</label>
                <input style="background-color: rgb(166, 232, 238);" class="form-control" type="number"
                    placeholder="Enter Age" name="" id="">
            </div>
            <div>
                <input type="checkbox" name="" id="tnc">
                <label class="form-label" for="tnc">I Accept Terms & Conditions</label>

            </div>
            <div style="text-align: center;">
                 <button style="width: 100%;" type="submit" class="btn btn-primary">Submit</button>
            </div>
        </form>
    </div>


</body>

</html>
